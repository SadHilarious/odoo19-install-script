name: odoo19fresh

services:
  init:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    command:
      - odoo
      - --db_host=db
      - --db_port=5432
      - --db_user=odoo
      - --db_password=odoo
      - --database=odoo
      - --data-dir=/var/lib/odoo
      - --without-demo=True
      - --no-http
      - -i
      - base,accountant,sale_management,purchase,stock,mrp,mrp_plm
      - --stop-after-init
    volumes:
      - odoo-data:/var/lib/odoo
      - "${ADDON_DIR:-/opt/docker-data/odoo19-enterprise-crack}:/mnt/extra-addons:ro"
    networks:
      - cloudflared_net
    restart: "no"

  web:
    image: odoo:19.0
    container_name: odoo19-fresh-web
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    command:
      - odoo
      - --db_host=db
      - --db_port=5432
      - --db_user=odoo
      - --db_password=odoo
      - --database=odoo
      - --db-filter=^odoo$
      - --data-dir=/var/lib/odoo
      - --without-demo=True
      - --http-interface=0.0.0.0
      - --http-port=8069
      - --workers=0
    ports:
      - "8069:8069"
    networks:
      - cloudflared_net
    volumes:
      - odoo-data:/var/lib/odoo
      - "${ADDON_DIR:-/opt/docker-data/odoo19-enterprise-crack}:/mnt/extra-addons:ro"
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: odoo19-fresh-postgres
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    networks:
      - cloudflared_net
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U odoo -d odoo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  odoo-data:
    name: odoo19_fresh_v2_odoo_data
  postgres-data:
    name: odoo19_fresh_v2_postgres_data

networks:
  cloudflared_net:
    external: true
